<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04040c">
<title>Pour toi ✨</title>
<style>
/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#04040c;color:#f4f1ff;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
/* Décors en calques (seule l'opacité s'anime) */
.bg{position:fixed;inset:0;opacity:0;transition:opacity 3s ease}
#bgN{background:radial-gradient(ellipse at 50% 35%,#171040 0%,#090919 55%,#04040c 100%)}
#bgB{background:linear-gradient(#0c1538,#050818)}
#bgR{background:linear-gradient(#2a3550,#0b1020)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}

/* ===== TEXTES ===== */
#txt{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;padding:8vmin;text-align:center;pointer-events:none}
#txt.low{justify-content:flex-end;padding-bottom:calc(10vh + env(safe-area-inset-bottom,0px))}
.l{font-size:clamp(18px,5.2vw,30px);line-height:1.5;letter-spacing:.03em;white-space:pre-line;max-width:34em;opacity:0;filter:blur(8px);
 transition:opacity 1.6s ease,filter 1.6s ease,transform 2s cubic-bezier(.2,.7,.2,1);
 text-shadow:0 0 16px rgba(180,160,255,.55),0 0 2px rgba(255,255,255,.5)}
.l.in{opacity:1;filter:blur(0);transform:none}
.v1{transform:translateX(-34px)}.v2{transform:scale(.72)}.v3{transform:translateY(-26px)}
.v4{transform:translateX(34px)}.v5{transform:translateY(22px) scale(1.08)}
.l.big{font-size:clamp(30px,10vw,66px);font-weight:700;letter-spacing:.07em;line-height:1.15}
.l.slam{transform:scale(2.1);transition-duration:1.6s,1.6s,1.3s}
.l.slam.in{animation:slam 2.6s ease-out both}
.l.pulse.in{animation:pulse 3.2s ease-in-out infinite}
.l.soft{font-size:clamp(15px,4vw,22px);font-style:italic;color:#d6d0f4}
@keyframes slam{0%{text-shadow:0 0 60px #fff,0 0 120px #b9a0ff}100%{text-shadow:0 0 16px rgba(180,160,255,.55)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);text-shadow:0 0 34px #ffc2dc,0 0 70px rgba(255,150,200,.5)}}

/* Prénom lettre par lettre */
#nm{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;
 font-size:clamp(46px,16vw,118px);font-weight:700;letter-spacing:.12em;padding-left:.12em;color:#fff;
 text-shadow:0 0 22px rgba(190,170,255,.8),0 0 50px rgba(150,120,255,.4)}
#nm.small{font-size:clamp(34px,11vw,80px)}
#nm span{display:inline-block;opacity:0;transform:translateY(22px) scale(.8);filter:blur(10px);transition:opacity 1.6s,transform 1.6s cubic-bezier(.2,.8,.2,1),filter 1.6s}
#nm.show span{opacity:1;transform:none;filter:blur(0);animation:glint 1.5s ease both}
#nm.dim.show span{opacity:.8}
@keyframes glint{0%{color:#fff}45%{color:#ffe2f3;text-shadow:0 0 30px #fff,0 0 60px #c8a8ff}100%{color:#fff}}

/* Boutons */
.btn{pointer-events:none;padding:15px 28px;border:1px solid rgba(255,255,255,.35);border-radius:40px;background:rgba(255,255,255,.06);
 color:#fff;font:inherit;font-size:clamp(16px,4.4vw,20px);letter-spacing:.05em;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
 box-shadow:0 0 28px rgba(255,160,210,.25)}
.btn.in{pointer-events:auto}
#sig{position:fixed;left:0;right:0;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(14px,3.8vw,19px);
 font-style:italic;color:#e8dff7;opacity:0;transition:opacity 2.5s;pointer-events:none;text-shadow:0 0 12px rgba(255,170,210,.5)}
#sig.in{opacity:.9}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
 background:rgba(255,255,255,.05);color:#fff;font-size:15px;opacity:0;pointer-events:none;transition:opacity 2s;z-index:20;cursor:pointer}
#snd.on{opacity:.45;pointer-events:auto}#snd.on:hover{opacity:.9}

/* Écran d'accueil */
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;background:#04040c;transition:opacity 1.4s;cursor:pointer;text-align:center;padding:8vmin}
#start h1{font-size:clamp(28px,8vw,52px);font-weight:400;letter-spacing:.1em;text-shadow:0 0 26px rgba(190,170,255,.7)}
#start p{font-size:clamp(14px,3.8vw,18px);color:#b9b2da;font-style:italic;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.l,#nm span{transition-duration:.6s!important}.l.slam{transform:none}.l.slam.in,.l.pulse.in,#start p{animation:none!important}}
</style>
</head>
<body>
<div class="bg" id="bgN"></div><div class="bg" id="bgB"></div><div class="bg" id="bgR"></div>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="nm"></div>
<div id="txt"></div>
<div id="sig">— Ton meilleur ami</div>
<button id="snd" aria-label="Son">🔊</button>
<div id="start"><h1 id="stTitle"></h1><p>Touche l'écran pour commencer</p></div>

<script>
/* ============ PERSONNALISATION ============ */
const CONFIG = {
  friendName: "JESSY",
  musicFile: "music.mp3"
};

/* ============ OUTILS ============ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;
const COOL = [205, 215, 255], ROSE = [255, 205, 225];
document.title = "Pour " + CONFIG.friendName + " ✨";
$('stTitle').textContent = "Pour " + CONFIG.friendName + " ✨";

/* ============ MOTEUR : un seul canvas, une seule boucle ============ */
const cv = $('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DT = 16, last = performance.now();
let mode = 'sky';          // 'sky' (particules) ou 'fly' (voyage)
let HF = null;             // fonction qui place la maison (hx,hy) des particules "membres"
let LM = 0;                // nb de points reliés (constellation)
const V = {zoom:1,glow:0,gr:1,lines:0,rain:0,shield:0,speed:.4,pathA:0,dark:0,at:.5,bt:.3,halo:0,star:0,pulse:0,orbR:0};
const TG = {}, SP = {};    // valeurs cibles + vitesses (interpolation fluide)
const tg = (k, v, s) => { TG[k] = v; SP[k] = s || .03; };
const HT = {x:0,y:0,s:1}, HTc = {fx:.5,fy:.4,h:.45};
const N = REDUCED ? 140 : (innerWidth * innerHeight > 600000 ? 330 : 250);

function layoutHT(){ HT.x = W*HTc.fx; HT.y = H*HTc.fy; HT.s = Math.min(W*.8/32, H*HTc.h/29); }
function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d;
  cx.setTransform(d,0,0,d,0,0); layoutHT();
}
addEventListener('resize', resize); resize();

/* Particules */
const P = [];
for (let i = 0; i < N; i++) P.push({x:0,y:0,vx:0,vy:0,hx:0,hy:0,r:rnd(.5,1.5),mx:rnd(.3,.95),a:0,ta:0,ph:rnd(6.28),tw:rnd(.6,2.2),
  z:rnd(.3,1),k:.0025,dm:.9,e:.04,g:1,tgG:1,hm:false,bx:0,by:0,orb:rnd(.35,1),c:COOL.slice(),tc:COOL});

/* Ciel : positions aléatoires, n étoiles visibles */
function setSky(n, snap){
  HF = null; LM = 0; tg('lines', 0, .05);
  P.forEach((p,i) => {
    p.hm = false; p.hx = rnd(W); p.hy = rnd(H); p.k = .0025; p.dm = .9; p.e = .04; p.tc = COOL; p.tgG = 1;
    p.ta = i < n ? p.mx : 0;
    if (snap) { p.x = p.hx; p.y = p.hy; p.vx = p.vy = 0; }
  });
}
/* Cœur : les n premières particules en deviennent les membres */
function heartHF(p, t){ const k = 1 + V.pulse*Math.sin(t*3.2); p.hx = HT.x + p.bx*HT.s*k; p.hy = HT.y + p.by*HT.s*k; }
function orbitHF(p, t){ const a = p.ph*3 + t*1.4, r = p.orb*V.orbR; p.hx = HT.x + Math.cos(a)*r; p.hy = HT.y + Math.sin(a)*r*.7; }
function setHeart(n, fill, k, rgb){
  HF = heartHF;
  for (let i = 0; i < N; i++) {
    const p = P[i]; p.hm = i < n; if (i >= n) continue;
    let t, r = 1;
    if (fill) { t = rnd(6.283); r = Math.random() < .3 ? 1 : Math.sqrt(rnd(.04,1)); } else t = i/n*6.283;
    const s = Math.sin(t);
    p.bx = 16*s*s*s*r;
    p.by = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t) + 2.5)*r;
    p.k = k; p.ta = Math.max(.7, p.mx); p.tc = rgb || ROSE;
  }
  if (!fill) { LM = n; }
}
/* Points d'un texte (étoiles qui écrivent le prénom) */
function textPoints(str, n){
  const w = 360, h = 120, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); let fs = 84; x.font = 'bold ' + fs + 'px Georgia';
  const mw = x.measureText(str).width; if (mw > 340) fs *= 340/mw;
  x.font = 'bold ' + fs + 'px Georgia'; x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(str, w/2, h/2);
  const d = x.getImageData(0,0,w,h).data, pts = [];
  for (let y = 0; y < h; y += 3) for (let xx = 0; xx < w; xx += 3) if (d[(y*w+xx)*4+3] > 128) pts.push([xx-w/2, y-h/2]);
  return pts.sort(() => Math.random()-.5).slice(0, n);
}

/* Effets : étincelles, comètes, pluie, voyage */
const SPK = [], COM = [], R = [], F = [];
for (let i = 0; i < 90; i++) R.push({x:rnd(innerWidth),y:rnd(innerHeight),v:rnd(.4,.8),l:rnd(10,22)});
for (let i = 0; i < 120; i++) F.push({x:rnd(-1,1),y:rnd(-1,1),z:rnd(.05,1),v:rnd(.5,1.8)});
function spark(x, y, n, c){
  for (let i = 0; i < n; i++) { if (SPK.length > 150) SPK.shift(); const a = rnd(6.28), v = rnd(.3,2.2);
    SPK.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:rnd(30,60),c:c || '255,230,245'}); }
}
function comet(){ COM.push({x:-30,y:rnd(H*.15,H*.6),vx:W/6500,vy:rnd(.01,.05)}); }
function flash(){
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = .75;
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity 1.8s ease-out'; f.style.opacity = 0; }));
}
function light(x, y, r, rgb, a){
  const g = cx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  cx.fillStyle = g; cx.fillRect(x-r, y-r, r*2, r*2);
}

/* Interaction tactile / souris */
const PT = {x:0,y:0,on:false};
addEventListener('pointerdown', e => { PT.x = e.clientX; PT.y = e.clientY; PT.on = true; spark(PT.x, PT.y, 10); });
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') PT.on = true;
  if (PT.on) { PT.x = e.clientX; PT.y = e.clientY; if (Math.random() < .35) spark(PT.x, PT.y, 1); }
});
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') PT.on = false; });
addEventListener('pointercancel', () => { PT.on = false; });

/* Rendu du ciel */
function drawSky(t){
  cx.save();
  if (V.zoom !== 1) { cx.translate(W/2,H/2); cx.scale(V.zoom,V.zoom); cx.translate(-W/2,-H/2); }
  if (V.glow > .01) light(W/2, H/2, Math.max(W,H)*.5*V.gr, '200,190,255', V.glow*.55);
  if (V.lines > .01 && LM) {
    cx.strokeStyle = 'rgba(255,215,235,' + V.lines + ')'; cx.lineWidth = .8; cx.beginPath();
    for (let i = 0; i < LM; i++) { const a = P[i], b = P[(i+1)%LM]; if (a.a > .05 && b.a > .05) { cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); } }
    cx.stroke();
  }
  for (let i = 0; i < N; i++) {
    const p = P[i];
    if (HF && p.hm) HF(p, t);
    p.vx = (p.vx + (p.hx-p.x)*p.k)*p.dm; p.vy = (p.vy + (p.hy-p.y)*p.k)*p.dm;
    if (PT.on) { const dx = p.x-PT.x, dy = p.y-PT.y, d = Math.hypot(dx,dy);
      if (d < 110 && d > .1) { const f = (1-d/110)*2.4; p.vx += dx/d*f; p.vy += dy/d*f; } }
    p.x += p.vx; p.y += p.vy;
    if (p.k === 0 && p.y < -12) { p.y = H+12; p.x = rnd(W); }
    p.a += (p.ta-p.a)*p.e; p.g += (p.tgG-p.g)*.02;
    for (let j = 0; j < 3; j++) p.c[j] += (p.tc[j]-p.c[j])*.03;
    if (p.a < .02) continue;
    const al = Math.min(1, p.a*(REDUCED ? 1 : .72 + .28*Math.sin(t*p.tw+p.ph)));
    const X = p.x + (REDUCED ? 0 : Math.sin(t*.4+p.ph)*1.6*p.z), Y = p.y + (REDUCED ? 0 : Math.cos(t*.35+p.ph)*1.6*p.z), r = p.r*p.g;
    cx.fillStyle = 'rgb(' + (p.c[0]|0) + ',' + (p.c[1]|0) + ',' + (p.c[2]|0) + ')';
    if (r > 1.1) { cx.globalAlpha = al*.16; cx.beginPath(); cx.arc(X,Y,r*4,0,6.283); cx.fill(); }
    cx.globalAlpha = al; cx.beginPath(); cx.arc(X,Y,r,0,6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  /* Pluie + dôme protecteur */
  if (V.rain > .02) {
    const sr = Math.min(W,H)*.34*V.shield, c0 = W/2, c1 = H/2;
    cx.strokeStyle = 'rgba(170,205,255,' + V.rain*.55 + ')'; cx.lineWidth = 1.2; cx.beginPath();
    for (const d of R) {
      d.y += d.v*DT;
      if (d.y > H+20) { d.y = -rnd(20,80); d.x = rnd(W); }
      if (V.shield > .05 && Math.hypot(d.x-c0, d.y-c1) < sr) { d.y = -rnd(20,120); d.x = rnd(W); }
      cx.moveTo(d.x,d.y); cx.lineTo(d.x-1.5,d.y+d.l);
    }
    cx.stroke();
  }
  if (V.shield > .02) {
    const sr = Math.min(W,H)*.34*V.shield, g = cx.createRadialGradient(W/2,H/2,sr*.55,W/2,H/2,sr);
    g.addColorStop(0, 'rgba(255,235,205,0)'); g.addColorStop(1, 'rgba(255,235,205,' + .24*V.shield + ')');
    cx.fillStyle = g; cx.beginPath(); cx.arc(W/2,H/2,sr,0,6.283); cx.fill();
    cx.strokeStyle = 'rgba(255,240,215,' + .6*V.shield + ')'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(W/2,H/2,sr,Math.PI,0); cx.stroke();
  }
  /* Étoile du final */
  if (V.star > .5) { light(HT.x, HT.y, V.star*4, '255,240,250', .8); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(HT.x,HT.y,V.star*.18,0,6.283); cx.fill(); }
  cx.restore();
}

/* Rendu du voyage (étoiles à profondeurs différentes + chemin + deux lumières) */
function drawFly(){
  cx.lineCap = 'round';
  for (const f of F) {
    f.z -= DT*.00022*V.speed*f.v;
    const k = .35/f.z; let sx = W/2 + f.x*k*W*.5, sy = H/2 + f.y*k*H*.5;
    if (f.z < .03 || sx < -20 || sx > W+20 || sy < -20 || sy > H+20) { f.z = 1; f.x = rnd(-1,1); f.y = rnd(-1,1); continue; }
    const k2 = .35/(f.z + .04*V.speed*f.v), px = W/2 + f.x*k2*W*.5, py = H/2 + f.y*k2*H*.5;
    cx.strokeStyle = 'rgba(220,225,255,' + Math.min(1,(1-f.z)*1.4) + ')'; cx.lineWidth = .6 + (1-f.z)*1.6;
    cx.beginPath(); cx.moveTo(px,py); cx.lineTo(sx,sy); cx.stroke();
  }
  if (V.dark > .01) { cx.fillStyle = 'rgba(2,2,12,' + V.dark*.62 + ')'; cx.fillRect(0,0,W,H); }
  if (V.pathA > .01) {
    const hy = H*.5, a = V.pathA*(1-V.dark*.7), g = cx.createLinearGradient(0,hy,0,H);
    g.addColorStop(0, 'rgba(200,190,255,0)'); g.addColorStop(1, 'rgba(190,175,255,' + a*.42 + ')');
    cx.fillStyle = g; cx.beginPath(); cx.moveTo(W/2-3,hy); cx.lineTo(W/2+3,hy); cx.lineTo(W/2+W*.3,H); cx.lineTo(W/2-W*.3,H); cx.fill();
    cx.strokeStyle = 'rgba(255,240,255,' + a*.5 + ')'; cx.lineWidth = 1.5; cx.setLineDash([4,16]); cx.lineDashOffset = -performance.now()*.03;
    cx.beginPath(); cx.moveTo(W/2,hy); cx.lineTo(W/2,H); cx.stroke(); cx.setLineDash([]);
  }
  if (V.pathA > .05) {
    const A = {x:W/2 + W*.012, y:H*(.9 - .38*V.at)}, B = {x:W/2 - W*.02, y:H*(.9 - .38*V.bt)};
    if (V.halo > .01) light(A.x + 34, A.y - 6, V.halo*80, '255,225,190', V.halo*.7);
    light(B.x, B.y, 26, '190,210,255', .5); cx.fillStyle = '#dce6ff'; cx.beginPath(); cx.arc(B.x,B.y,2.8+(1-V.bt)*3,0,6.283); cx.fill();
    light(A.x, A.y, 30, '255,215,238', .6); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(A.x,A.y,3+(1-V.at)*3.5,0,6.283); cx.fill();
  }
}
/* Étincelles et comètes */
function drawFX(){
  for (let i = SPK.length-1; i >= 0; i--) {
    const s = SPK[i]; s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy *= .96;
    if (++s.l > s.m) { SPK.splice(i,1); continue; }
    cx.globalAlpha = 1 - s.l/s.m; cx.fillStyle = 'rgb(' + s.c + ')'; cx.beginPath(); cx.arc(s.x,s.y,1.3,0,6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  for (let i = COM.length-1; i >= 0; i--) {
    const c = COM[i]; c.x += c.vx*DT; c.y += c.vy*DT*3;
    if (c.x > W+40) { COM.splice(i,1); continue; }
    const g = cx.createLinearGradient(c.x-c.vx*420,c.y-c.vy*1260,c.x,c.y);
    g.addColorStop(0,'rgba(200,200,255,0)'); g.addColorStop(1,'rgba(255,255,255,.9)');
    cx.strokeStyle = g; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(c.x-c.vx*420,c.y-c.vy*1260); cx.lineTo(c.x,c.y); cx.stroke();
    light(c.x, c.y, 14, '255,255,255', .6);
  }
}
function frame(now){
  DT = Math.min(now-last, 50); last = now;
  for (const k in TG) V[k] += (TG[k]-V[k])*SP[k];
  cx.clearRect(0,0,W,H);
  if (mode === 'fly') drawFly(); else drawSky(now/1000);
  drawFX();
  requestAnimationFrame(frame);
}

/* ============ TEXTE & DÉCOR ============ */
async function say(txt, o = {}){
  const d = document.createElement('div'); d.className = 'l ' + (o.c || ''); d.textContent = txt; $('txt').appendChild(d);
  void d.offsetWidth; d.classList.add('in');
  await sleep(o.hold || 2600);
  if (!o.keep) { d.classList.remove('in'); await sleep(1600); d.remove(); }
  return d;
}
const lowTxt = b => $('txt').classList.toggle('low', b);
function setBg(id){ ['bgN','bgB','bgR'].forEach(k => $(k).style.opacity = k === id ? 1 : 0); }
function showName(txt, cls, extra, top){
  const n = $('nm'); n.className = cls || ''; n.style.top = top || '50%'; n.innerHTML = '';
  const add = (ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.transitionDelay = (i*.22) + 's'; s.style.animationDelay = (1.4 + i*.18) + 's'; n.appendChild(s); };
  [...txt].forEach(add); if (extra) add(extra, [...txt].length);
  void n.offsetWidth; n.classList.add('show');
}
function hideName(){ const n = $('nm'); n.querySelectorAll('span').forEach(s => s.style.transitionDelay = '0s'); n.classList.remove('show'); }
const reveal = async (from, to, ms) => { for (let i = from; i < to; i++) { P[i].ta = P[i].mx; await sleep(ms); } };

/* ============ SCÈNES ============ */
const SCENES = [() => showScene1(), () => showScene2(), () => showScene3(), () => showScene4(), () => showScene5(),
  () => showScene6(), () => showScene7(), () => showScene8(), () => showSurprise(), () => showFinale()];
let idx = -1;
function nextScene(){ idx++; if (SCENES[idx]) SCENES[idx](); }

/* SCÈNE 1 — LE VIDE */
async function showScene1(){
  mode = 'sky'; setBg(null); lowTxt(false); setSky(0, true);
  for (let i = 0; i < 10; i++) { P[i].ta = P[i].mx; await sleep(450); }
  comet(); await sleep(1600); comet(); await sleep(1600); comet(); await sleep(1200);
  await say('Il existe des personnes...', {hold:3200});
  await say('...qui arrivent dans notre vie sans prévenir.', {hold:3400});
  const t = say("Et sans même qu'on s'en rende compte...", {hold:3600});
  await sleep(2400); reveal(10, Math.floor(N*.6), 22);
  await t;
  await say('...elles finissent par devenir importantes.', {hold:3600});
  nextScene();
}

/* SCÈNE 2 — LE NOM */
async function showScene2(){
  setBg('N');
  P.forEach(p => { p.hx = W/2 + (p.x-W/2)*4; p.hy = H/2 + (p.y-H/2)*4; p.k = .0012; });   // les étoiles s'éloignent
  await sleep(900); P.forEach((p,i) => { if (i) p.ta = 0; });
  const s = P[0]; s.hx = W/2; s.hy = H*.14; s.k = .0025; s.ta = 1; s.tgG = 3;                // une seule reste
  await sleep(2600);
  s.tgG = 6; s.hy = H/2; s.k = .0009;                                                       // elle descend lentement
  await sleep(4200);
  flash(); spark(W/2, H/2, 50); s.tgG = 3;
  showName(CONFIG.friendName); lowTxt(true);
  for (let i = 0; i < 6; i++) { await sleep(450); spark(W/2 + rnd(-110,110), H/2 + rnd(-35,35), 8, '230,215,255'); }
  await sleep(1200);
  await say('Oui, toi.', {hold:2600});
  await say('Toi, ' + CONFIG.friendName + '.', {hold:3200});
  hideName(); s.ta = 0; await sleep(1800);
  nextScene();
}

/* SCÈNE 3 — LA CONSTELLATION */
async function showScene3(){
  HTc.fx = .5; HTc.fy = .38; HTc.h = .4; layoutHT();
  setSky(Math.floor(N*.55), true); await sleep(900);
  setHeart(56, false, .0012);                                    // le cœur se construit étoile par étoile
  await sleep(6000); tg('lines', .45, .02);
  lowTxt(true);
  await say('Tu comptes énormément pour moi. ❤️', {hold:4000});
  await say('Et je voulais simplement que tu le saches.', {hold:4400});
  for (let i = 0; i < 56; i++) P[i].ta = 0; tg('lines', 0, .05);
  await sleep(1800); nextScene();
}

/* SCÈNE 4 — LE VOYAGE */
async function showScene4(){
  mode = 'fly'; setBg('N'); lowTxt(true); V.speed = .3; tg('speed', 1, .01);
  V.at = .45; V.bt = .22; V.dark = 0; V.halo = 0; tg('pathA', 1, .012); tg('at', .6, .004); tg('bt', .22, .01);
  await sleep(3500);
  tg('bt', .56, .02);                                            // la deuxième particule accélère et rejoint
  await say('La vie ne sera pas toujours facile.', {hold:3600});
  await say('Il y aura des jours où tu te sentiras fatiguée.', {hold:3600});
  tg('dark', 1, .015); tg('bt', .2, .01);
  await say('Des jours où tu auras envie de tout abandonner.', {hold:4000});
  tg('halo', 1, .015);
  await say('Et dans ces moments-là...', {hold:3600});
  tg('bt', .58, .02);
  await say("...tu n'auras pas besoin d'affronter tout ça toute seule.", {hold:4600});
  tg('dark', 0, .02); tg('halo', .4, .02); await sleep(1500);
  nextScene();
}

/* SCÈNE 5 — PROMESSE */
async function showScene5(){
  mode = 'sky'; setSky(Math.floor(N*.3), true); P.forEach(p => p.ta *= .5);
  setBg('B'); lowTxt(false); V.gr = .15; V.glow = 0; tg('glow', .35, .01); tg('gr', 1, .008);
  await sleep(2500);
  await say('Je ne pourrai peut-être pas régler tous tes problèmes.', {hold:4000});
  await say('Je ne pourrai peut-être pas toujours trouver les bons mots.', {hold:4000});
  await say('Mais je peux te promettre une chose.', {hold:3600});
  setBg(null); P.forEach(p => p.ta = 0); tg('glow', 0, .08); await sleep(2400);
  V.gr = .3; tg('glow', .5, .02);
  await say('JE SERAI LÀ.', {c:'big slam', hold:4800});
  await say("Pour t'écouter.", {c:'v1', hold:2400});
  await say('Pour te soutenir.', {c:'v2', hold:2400});
  await say('Pour te faire rire.', {c:'v3', hold:2400});
  await say('Pour te rappeler ta valeur.', {c:'v4', hold:2800});
  await say('Et simplement pour être là.', {c:'v5', hold:3600});
  tg('glow', 0, .04); nextScene();
}

/* SCÈNE 6 — LES MAUVAIS JOURS */
async function showScene6(){
  setSky(0, true); setBg('R'); lowTxt(true); V.rain = 0; tg('rain', 1, .02);
  showName(CONFIG.friendName, 'dim');
  await sleep(2500);
  const t = say('Et si un jour tu traverses une mauvaise période...', {hold:5200});
  await sleep(2200); tg('glow', .3, .01); V.gr = .6; tg('shield', 1, .012);       // la lumière protège le prénom
  await t;
  tg('rain', 0, .025); setBg('B'); setSky(Math.floor(N*.6)); await sleep(2800);   // la pluie s'arrête, les étoiles reviennent
  hideName(); tg('shield', 0, .03); tg('glow', 0, .03);
  await say('Rappelle-toi simplement...', {hold:3600});
  lowTxt(false);
  await say('TU PEUX COMPTER SUR MOI.', {c:'big pulse', hold:6500});
  nextScene();
}

/* SCÈNE 7 — LE CIEL */
async function showScene7(){
  setBg('N'); lowTxt(true); setSky(Math.floor(N*.85), true); P.forEach(p => p.ta = p.mx);
  V.zoom = 1.7; tg('zoom', 1, .012);                                               // la caméra recule
  await sleep(3800);
  const pts = textPoints(CONFIG.friendName, Math.min(N-20, 170)), sc = Math.min(W*.85,520)/360;
  pts.forEach((q,i) => { const p = P[i]; p.hx = W/2 + q[0]*sc; p.hy = H*.42 + q[1]*sc; p.ta = 1; p.k = .003; });
  await sleep(5000);
  say('Touche le ciel.', {c:'soft', hold:2800});
  await sleep(2500); setSky(Math.floor(N*.85));                                    // elles se dispersent
  await sleep(8000);
  nextScene();
}

/* SCÈNE 8 — LE CŒUR */
async function showScene8(){
  HTc.fx = .5; HTc.fy = .4; HTc.h = .5; layoutHT(); lowTxt(true);
  const n = Math.min(N, 300); setSky(Math.floor(N*.15), true); P.forEach(p => p.ta *= .5);
  setHeart(n, true, .002, [255,120,150]); HF = orbitHF; V.orbR = 0; tg('orbR', 70, .01);
  P.forEach((p,i) => { if (i < n) p.ta = 0; });
  for (let i = 0; i < n; i++) { const p = P[i]; p.x = HT.x; p.y = HT.y; p.vx = p.vy = 0; p.ta = Math.max(.7, p.mx); await sleep(i < 6 ? 500 : 38); }
  await sleep(1200);
  HF = heartHF; tg('pulse', .03, .01);                                             // le cœur se forme
  await sleep(6000);
  showName(CONFIG.friendName, 'small', null, HT.y + 'px');
  await sleep(2500);
  await say("Merci d'être dans ma vie.", {hold:3800});
  await say("Merci d'être toi.", {hold:4200});
  nextScene();
}

/* FINALE — LA SURPRISE */
async function showSurprise(){
  const b = document.createElement('button'); b.className = 'l btn'; b.textContent = 'Il reste une dernière chose...';
  $('txt').appendChild(b); void b.offsetWidth; b.classList.add('in');
  b.addEventListener('click', () => { b.classList.remove('in'); setTimeout(() => b.remove(), 1700); nextScene(); }, {once:true});
}
async function showFinale(){
  hideName(); setBg(null); P.forEach(p => p.ta = 0); tg('pulse', 0, .1); tg('glow', 0, .1); SPK.length = 0;
  await sleep(2600);                                                               // écran noir
  HTc.fx = .5; HTc.fy = .4; HTc.h = .5; layoutHT();
  tg('star', 26, .012); await sleep(4200);                                         // la petite étoile grandit
  flash(); tg('star', 0, .25); spark(HT.x, HT.y, 100, '255,200,225');
  setHeart(N, true, .0035); HF = heartHF;                                          // elle explose en particules
  P.forEach(p => { const a = rnd(6.28), v = rnd(2,13)*Math.max(W,H)/700; p.x = HT.x; p.y = HT.y; p.vx = Math.cos(a)*v; p.vy = Math.sin(a)*v;
    p.a = 0; p.e = .08; p.c = [255,245,250]; p.tc = [255, 60 + rnd(90)|0, 100 + rnd(70)|0]; });
  tg('pulse', .035, .01); lowTxt(true);
  await sleep(4500);
  await say('Peu importe ce que la vie nous réserve...', {hold:3800}); await sleep(600);
  await say('Peu importe la distance.', {hold:3400}); await sleep(600);
  await say('Peu importe les mauvais jours.', {hold:3400}); await sleep(600);
  await say('Tu pourras toujours compter sur moi.', {c:'big', hold:4600}); await sleep(800);
  showName(CONFIG.friendName, 'small', ' ❤️', HT.y + 'px'); await sleep(5000);
  const d = await say('Je serai toujours dans ton coin.', {keep:true, hold:3000});
  $('sig').classList.add('in'); await sleep(5500);
  /* Animation finale */
  d.classList.remove('in'); $('sig').classList.remove('in'); hideName(); await sleep(1800);
  d.remove();
  await say('Cette petite histoire était pour toi.', {c:'soft', hold:4500});
  HF = null; tg('pulse', 0, .05);                                                  // le cœur devient pluie d'étoiles
  P.forEach(p => { p.hm = false; p.k = 0; p.dm = 1; p.e = .04; p.vx = rnd(-.3,.3); p.vy = -rnd(.4,1.6); p.tc = COOL; });
  await sleep(6500);
  setSky(N, false); P.forEach(p => p.ta = p.mx);
  await sleep(5500);
  P.forEach(p => { p.ta = 0; p.e = .06; });                                        // une dernière étoile reste
  const s = P[0]; s.hx = W/2; s.hy = H/2; s.k = .004; s.tgG = 4; s.e = .15; s.ta = 1;
  await sleep(2500);
  for (let i = 0; i < 2; i++) { s.ta = 0; await sleep(450); s.ta = 1; await sleep(450); }   // elle clignote deux fois
  await sleep(1800); s.ta = 0; s.e = .05;                                          // écran noir, fin
}

/* ============ MUSIQUE ============ */
const audio = new Audio(); audio.loop = true; audio.preload = 'auto'; audio.volume = 0; audio.src = CONFIG.musicFile;
let started = false;
audio.addEventListener('error', () => { $('snd').style.display = 'none'; });
function startMusic(){
  audio.play().then(() => { const iv = setInterval(() => { audio.volume = Math.min(.7, audio.volume + .03); if (audio.volume >= .7) clearInterval(iv); }, 150); }).catch(() => {});
}
$('snd').addEventListener('pointerdown', e => e.stopPropagation());
$('snd').addEventListener('click', () => { audio.muted = !audio.muted; $('snd').textContent = audio.muted ? '🔇' : '🔊'; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) audio.pause(); else if (started && !audio.muted) audio.play().catch(() => {});
});

/* ============ DÉMARRAGE (1ère interaction) ============ */
$('start').addEventListener('pointerdown', () => {
  if (started) return; started = true;
  startMusic(); $('start').style.opacity = 0; $('snd').classList.add('on');
  setTimeout(() => { $('start').remove(); idx = 0; showScene1(); }, 1500);
});
setSky(0, true);
requestAnimationFrame(frame);
</script>
